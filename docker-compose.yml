services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: wine
      POSTGRES_USER: wine
      POSTGRES_PASSWORD: wine
    ports:
      - "5432:5432"
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wine -d wine"]
      interval: 3s
      retries: 20

volumes:
  pgdata:
